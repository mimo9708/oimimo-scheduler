{# 模板管理 — 新建/编辑模板表单（渲染进 #tpl-mgr-list，独立于订单，不写 orders 表） #}
{% set d = (tpl.data if tpl else {}) or {} %}
<form hx-post="{{ '/orders/templates' if is_new else '/orders/templates/' ~ tpl.id }}"
      hx-target="#tpl-mgr-list" hx-swap="innerHTML"
      style="display:flex;flex-direction:column;gap:var(--space-sm);">
    <div class="form-group">
        <label for="tpl-name">模板名称 *</label>
        <input type="text" name="name" id="tpl-name" required
               value="{{ tpl.name if tpl else '' }}" placeholder="如：米画师标准约稿">
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>客户</label>
            <select name="customer_id">
                <option value="">— 不指定 —</option>
                {% for c in customers %}
                <option value="{{ c.id }}" {% if d.customer_id|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>项目名称</label>
            <input type="text" name="project_name" value="{{ d.project_name or '' }}" placeholder="如：罗马大浴场双人">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>来源</label>
            <input type="text" name="source" list="tpl-source-list" value="{{ d.source or '' }}" autocomplete="off">
            <datalist id="tpl-source-list">{% for s in SOURCE_CHOICES %}<option value="{{ s }}">{% endfor %}</datalist>
        </div>
        <div class="form-group">
            <label>稿件类别</label>
            <input type="text" name="commission_type" list="tpl-type-list" value="{{ d.commission_type or '' }}" autocomplete="off">
            <datalist id="tpl-type-list">{% for t in COMMISSION_TYPE_CHOICES %}<option value="{{ t }}">{% endfor %}</datalist>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>用途</label>
            <select name="is_commercial">
                <option value="0" {% if d.is_commercial|string != '1' %}selected{% endif %}>私用</option>
                <option value="1" {% if d.is_commercial|string == '1' %}selected{% endif %}>商用</option>
            </select>
        </div>
        <div class="form-group">
            <label>阶段流程</label>
            <select id="tpl-stage-flow-preset" onchange="onTplFlowChange()">
                <option value="">— 不指定 —</option>
                {% for f in STAGE_FLOWS %}
                <option value="{{ loop.index0 }}">{{ f.name|e }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <input type="hidden" name="stage_flow" id="tpl-stage-flow-hidden" value='{{ d.stage_flow or "" }}'>
    <div class="form-group">
        <label>阶段</label>
        <select name="current_stage" id="tpl-stage-select">
            {% for s in STAGE_CHOICES %}
            <option value="{{ s }}" {% if s == (d.current_stage or '待开始') %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>收款</label>
        <select name="payment_status">
            {% for s in PAYMENT_CHOICES %}
            <option value="{{ s }}" {% if s == (d.payment_status or '未收款') %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>原订单链接</label>
        <input type="url" name="platform_url" value="{{ d.platform_url or '' }}" placeholder="https://...">
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>定金 (¥)</label>
            <input type="number" name="deposit" step="0.01" min="0" value="{{ d.deposit or '' }}">
        </div>
        <div class="form-group">
            <label>尾款 (¥)</label>
            <input type="number" name="balance" step="0.01" min="0" value="{{ d.balance or '' }}">
        </div>
        <div class="form-group">
            <label>手续费 (%)</label>
            <input type="number" name="platform_fee_pct" step="0.1" min="0" max="100" value="{{ d.platform_fee_pct or '' }}">
        </div>
    </div>
    {# 排期字段 — 与新建订单表单同步 #}
    <div style="font-size:0.82rem;font-weight:600;color:var(--color-text-secondary);margin-top:var(--space-sm);">排期</div>
    <div class="form-row">
        <div class="form-group">
            <label>排单开始</label>
            <input type="date" name="scheduled_start" value="{{ d.scheduled_start or '' }}">
        </div>
        <div class="form-group">
            <label>排单截止</label>
            <input type="date" name="scheduled_end" value="{{ d.scheduled_end or '' }}">
        </div>
    </div>
    <div class="form-group">
        <label>页面截稿日</label>
        <input type="date" name="page_deadline" value="{{ d.page_deadline or '' }}">
    </div>
    {# 工时字段 — 与新建订单表单同步 #}
    <div style="font-size:0.82rem;font-weight:600;color:var(--color-text-secondary);margin-top:var(--space-sm);">工时</div>
    <div class="form-row">
        <div class="form-group">
            <label>预估工时 (h)</label>
            <input type="number" name="estimated_hours" step="0.5" min="0" value="{{ d.estimated_hours or '' }}" placeholder="如 8">
        </div>
        <div class="form-group">
            <label>实际工时 (h)</label>
            <input type="number" name="work_hours" step="0.5" min="0" value="{{ d.work_hours or '' }}" placeholder="完成后填写">
        </div>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-weight:normal;cursor:pointer;font-size:0.82rem;">
        <input type="checkbox" name="exclude_hourly" value="1" style="width:auto;"
               {% if d.exclude_hourly|string == '1' %}checked{% endif %}>
        此订单不参与时薪统计
    </label>
    <div class="form-group">
        <label>备注</label>
        <textarea name="notes" rows="2">{{ d.notes or '' }}</textarea>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;padding-top:var(--space-sm);border-top:1px solid var(--color-border);">
        <button type="submit" class="btn btn-primary">{{ '创建模板' if is_new else '保存修改' }}</button>
        <button type="button" class="btn btn-ghost"
                hx-get="/orders/templates/list" hx-target="#tpl-mgr-list" hx-swap="innerHTML">取消</button>
    </div>
</form>
<script>
var _TPL_FLOWS = {{ STAGE_FLOWS | tojson }};
function onTplFlowChange() {
    var sel = document.getElementById('tpl-stage-flow-preset');
    var val = sel.value;
    var hidden = document.getElementById('tpl-stage-flow-hidden');
    var stageSelect = document.getElementById('tpl-stage-select');
    if (val === '') {
        hidden.value = '';
        return;
    }
    var flow = _TPL_FLOWS[parseInt(val, 10)];
    if (flow && flow.stages) {
        hidden.value = JSON.stringify(flow.stages);
        if (stageSelect) {
            var curVal = stageSelect.value;
            stageSelect.innerHTML = '';
            flow.stages.forEach(function(s) {
                var opt = document.createElement('option');
                opt.value = s.name; opt.textContent = s.name;
                if (s.name === curVal) opt.selected = true;
                stageSelect.appendChild(opt);
            });
            // 退单选项始终保留
            var cancelOpt = document.createElement('option');
            cancelOpt.value = '退单'; cancelOpt.textContent = '退单';
            stageSelect.appendChild(cancelOpt);
        }
    }
}
// 编辑模式：尝试自动选中匹配的流程预设
{% if tpl and d.stage_flow %}
(function() {
    try {
        var raw = document.getElementById('tpl-stage-flow-hidden').value;
        if (!raw) return;
        var savedFlow = JSON.parse(raw);
        // 按 stages 名称匹配流程预设
        var savedNames = savedFlow.map(function(s){ return s.name; }).join(',');
        for (var i = 0; i < _TPL_FLOWS.length; i++) {
            var flowNames = _TPL_FLOWS[i].stages.map(function(s){ return s.name; }).join(',');
            if (savedNames === flowNames) {
                document.getElementById('tpl-stage-flow-preset').value = String(i);
                // 同步阶段下拉
                var stageSelect = document.getElementById('tpl-stage-select');
                if (stageSelect) {
                    var curVal = stageSelect.value;
                    stageSelect.innerHTML = '';
                    _TPL_FLOWS[i].stages.forEach(function(s) {
                        var opt = document.createElement('option');
                        opt.value = s.name; opt.textContent = s.name;
                        if (s.name === curVal) opt.selected = true;
                        stageSelect.appendChild(opt);
                    });
                    var cancelOpt = document.createElement('option');
                    cancelOpt.value = '退单'; cancelOpt.textContent = '退单';
                    if (curVal === '退单') cancelOpt.selected = true;
                    stageSelect.appendChild(cancelOpt);
                }
                break;
            }
        }
    } catch(e) {}
})();
{% endif %}
</script>
